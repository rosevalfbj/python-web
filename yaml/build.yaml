metadata:
  labels:
    agent: docker-image-builder
spec:
  containers:
    - name: jnlp
      image: jenkins/inbound-agent
      env:
        - name: CONTAINER_ENV_VAR
          value: jnlp
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 4000m
          memory: 1024Mi
      securityContext:
        runAsUser: 0
    - name: podman
      image: quay.io/podman/stable
      tty: true
      env:
        - name: CONTAINER_ENV_VAR
          value: podman
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 4000m
          memory: 2048Mi
      securityContext:
        runAsUser: 0     